<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오맵 장소 검색 서비스</title>
    
    <!-- Kakao Maps JavaScript SDK 불러오기 (libraries=services 포함) -->
    <!-- appkey 파라미터에 발급받은 JavaScript 키를 넣습니다. -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=2ddbfce8a5f51075d537fc3a95774ca4&libraries=services"></script>

    <style>
        /* CSS 스타일링 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Malgun Gothic', sans-serif;
            overflow: hidden;
        }

        /* 화면 2분할 레이아웃 컨테이너 */
        .container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* 왼쪽: 검색 영역 (검색창 + 결과 리스트) */
        .sidebar {
            width: 350px;
            height: 100%;
            background-color: #f8f9fa;
            border-right: 1px solid #e9ecef;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        /* 검색창 영역 */
        .search-box {
            padding: 15px;
            background-color: #ffffff;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            gap: 8px;
        }

        .search-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            outline: none;
            font-size: 14px;
        }

        .search-button {
            padding: 10px 15px;
            background-color: #fee500; /* 카카오 시그니처 노란색 */
            color: #000000;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .search-button:hover {
            background-color: #fada0a;
        }

        /* 검색 결과 리스트 목록 */
        .places-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }

        /* 검색 결과 개별 항목 */
        .place-item {
            padding: 15px;
            border-bottom: 1px solid #f1f3f5;
            background-color: #ffffff;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .place-item:hover {
            background-color: #e7f5ff;
        }

        .place-title {
            font-size: 16px;
            font-weight: bold;
            color: #333333;
            margin-bottom: 5px;
        }

        .place-address {
            font-size: 13px;
            color: #666666;
        }

        .place-phone {
            font-size: 12px;
            color: #0984e3;
            margin-top: 4px;
        }

        /* 오른쪽: 지도 영역 */
        .map-container {
            flex: 1;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- 메인 컨테이너 (왼쪽: 사이드바, 오른쪽: 지도) -->
    <div class="container">
        <!-- 왼쪽 영역 -->
        <div class="sidebar">
            <div class="search-box">
                <input type="text" id="keyword" class="search-input" placeholder="장소를 검색하세요 (예: 맛집)" onkeypress="handleKeyPress(event)">
                <button class="search-button" onclick="searchPlaces()">검색</button>
            </div>
            <ul id="placesList" class="places-list"></ul>
        </div>

        <!-- 오른쪽 지도 영역 -->
        <div class="map-container">
            <div id="map"></div>
        </div>
    </div>

    <script>
        // 전역 변수 선언
        let map; // 지도 객체
        let ps;  // 장소 검색 객체
        let infowindow; // 마커 클릭 시 표시될 정보창
        let markers = []; // 생성된 마커들을 관리하기 위한 배열

        // 카카오맵 SDK 로드가 완료된 후 실행되는 안전한 초기화 함수
        kakao.maps.load(function() {
            initMap();
        });

        // 지도 및 초기 서비스 초기화 함수
        function initMap() {
            const mapContainer = document.getElementById('map');
            
            // 기본 중심 좌표 (위치 권한 획득 전 기본값: 서울시청)
            const defaultPosition = new kakao.maps.LatLng(37.566826, 126.978656);
            
            // 지도 기본 옵션 설정 (확대 레벨: 5)
            const mapOptions = {
                center: defaultPosition,
                level: 5
            };

            // 지도 생성
            map = new kakao.maps.Map(mapContainer, mapOptions);

            // 장소 검색 객체 및 정보창 생성
            ps = new kakao.maps.services.Places();
            infowindow = new kakao.maps.InfoWindow({ zIndex: 1 });

            // 사용자 브라우저의 현재 위치 권한 요청 및 위치 파악
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;  // 위도
                        const lon = position.coords.longitude; // 경도
                        const locPosition = new kakao.maps.LatLng(lat, lon);

                        // 지도의 중심을 현재 위치로 이동
                        map.setCenter(locPosition);

                        // 현재 위치에 표시할 마커 생성
                        const currentMarker = new kakao.maps.Marker({
                            map: map,
                            position: locPosition
                        });

                        // 현재 위치 안내 정보창 생성
                        const currentInfoWindow = new kakao.maps.InfoWindow({
                            content: '<div style="padding:5px;font-size:12px;">📍 현재 위치</div>'
                        });
                        currentInfoWindow.open(map, currentMarker);
                    },
                    function(error) {
                        console.warn("위치 권한을 얻을 수 없어 기본 위치(서울시청)로 설정됩니다.", error);
                    }
                );
            }
        }

        // 키보드 엔터키 입력 처리 함수
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                searchPlaces();
            }
        }

        // 키워드 장소 검색 함수
        function searchPlaces() {
            const keyword = document.getElementById('keyword').value.trim();

            if (!keyword) {
                alert('검색어를 입력해 주세요!');
                return;
            }

            // 카카오 장소 검색 서비스 실행 (현재 지도 중심 기반으로 검색)
            ps.keywordSearch(keyword, placesSearchCB, {
                location: map.getCenter()
            });
        }

        // 장소 검색 완료 시 호출되는 콜백 함수
        function placesSearchCB(data, status, pagination) {
            if (status === kakao.maps.services.Status.OK) {
                // 검색 성공 시 결과 리스트 및 마커 표시
                displayPlaces(data);
            } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                alert('검색 결과가 존재하지 않습니다.');
            } else if (status === kakao.maps.services.Status.ERROR) {
                alert('검색 결과 중 오류가 발생했습니다.');
            }
        }

        // 검색 결과를 화면 및 지도에 표시하는 함수
        function displayPlaces(places) {
            const listEl = document.getElementById('placesList');
            
            // 기존 검색 결과 리스트 및 지도 상의 마커 초기화
            listEl.innerHTML = '';
            removeAllMarkers();

            // 지도 범위를 재설정하기 위한 Bounds 객체 생성
            const bounds = new kakao.maps.LatLngBounds();

            for (let i = 0; i < places.length; i++) {
                // 장소 위치 좌표 객체 생성
                const placePosition = new kakao.maps.LatLng(places[i].y, places[i].x);
                
                // 마커 생성 및 지도 표시
                const marker = addMarker(placePosition, i);

                // 검색 결과 HTML 목록 항목 생성
                const itemEl = createListItem(places[i]);

                // 지도 범위 연장을 위해 좌표 추가
                bounds.extend(placePosition);

                // 마커 및 리스트 아이템 마우스 이벤트 등록 (클릭 및 오버)
                (function(marker, title, placePosition) {
                    // 마커 클릭 시 정보창 표시 및 지도 이동
                    kakao.maps.event.addListener(marker, 'click', function() {
                        displayInfoWindow(marker, title);
                        map.panTo(placePosition);
                    });

                    // 리스트 아이템 클릭 시 지도 이동 및 정보창 표시
                    itemEl.onclick = function() {
                        displayInfoWindow(marker, title);
                        map.panTo(placePosition);
                    };
                })(marker, places[i].place_name, placePosition);

                listEl.appendChild(itemEl);
            }

            // 검색된 장소들이 모두 보이도록 지도 범위 조정
            map.setBounds(bounds);
        }

        // 리스트 항목 HTML 생성 함수
        function createListItem(place) {
            const el = document.createElement('li');
            el.className = 'place-item';

            let addressText = place.road_address_name ? place.road_address_name : place.address_name;
            let phoneText = place.phone ? place.phone : '전화번호 없음';

            el.innerHTML = `
                <div class="place-title">${place.place_name}</div>
                <div class="place-address">${addressText}</div>
                <div class="place-phone">${phoneText}</div>
            `;

            return el;
        }

        // 지도에 마커를 추가하는 함수
        function addMarker(position, idx) {
            const marker = new kakao.maps.Marker({
                position: position,
                map: map
            });

            markers.push(marker); // 관리용 배열에 마커 보관
            return marker;
        }

        // 이전 검색 마커들을 모두 삭제하는 함수
        function removeAllMarkers() {
            for (let i = 0; i < markers.length; i++) {
                markers[i].setMap(null);
            }
            markers = [];
        }

        // 마커 클릭 시 정보창을 띄우는 함수
        function displayInfoWindow(marker, title) {
            const content = `<div style="padding:8px;font-size:12px;font-weight:bold;white-space:nowrap;">${title}</div>`;
            infowindow.setContent(content);
            infowindow.open(map, marker);
        }
    </script>
</body>
</html>
