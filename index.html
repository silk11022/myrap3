
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>장소 검색 서비스</title>

  <style>
    /* 기본 화면 설정 */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #222;
    }

    /* 화면을 왼쪽과 오른쪽으로 나눕니다. */
    .container {
      display: flex;
      width: 100%;
      height: 100vh;
      height: 100dvh;
    }

    /* 왼쪽 검색창 영역 */
    .sidebar {
      width: 360px;
      flex-shrink: 0;
      padding: 24px;
      overflow-y: auto;
      background: white;
      border-right: 1px solid #ddd;
    }

    h1 {
      margin-top: 0;
      font-size: 24px;
    }

    .description {
      color: #777;
      font-size: 14px;
      line-height: 1.6;
    }

    /* 검색창과 버튼 */
    .search-form {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }

    #searchInput {
      width: 100%;
      min-width: 0;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
    }

    #searchButton {
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      background: #fee500;
      font-weight: bold;
      cursor: pointer;
    }

    /* 상태 메시지 */
    #statusMessage {
      margin-top: 20px;
      padding: 12px;
      background: #f5f5f5;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    /* 검색 결과 목록 */
    #resultList {
      margin-top: 16px;
    }

    .place-item {
      padding: 14px 8px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .place-item:hover {
      background: #fafafa;
    }

    .place-name {
      margin-bottom: 8px;
      font-weight: bold;
    }

    .place-category {
      margin-bottom: 6px;
      color: #888;
      font-size: 12px;
    }

    .place-address {
      color: #555;
      font-size: 13px;
      line-height: 1.6;
    }

    .empty-message {
      color: #777;
      font-size: 13px;
      line-height: 1.6;
    }

    /* 오른쪽 지도 */
    #map {
      flex: 1;
      min-width: 0;
      height: 100%;
      background: #e9e9e9;
    }

    /* 화면이 좁을 때 */
    @media (max-width: 600px) {
      .sidebar {
        width: 42%;
        padding: 12px;
      }

      h1 {
        font-size: 18px;
      }

      #searchButton {
        padding: 10px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- 왼쪽: 검색창과 상태 메시지 -->
    <aside class="sidebar">
      <h1>장소 검색</h1>

      <p class="description">
        장소를 검색하고 지도에서 위치를 확인하세요.
      </p>

      <form id="searchForm" class="search-form">
        <input
          id="searchInput"
          type="text"
          placeholder="예: 강남역, 카페"
          aria-label="장소 검색"
          required
        >
        <button id="searchButton" type="submit">
          검색
        </button>
      </form>

      <!-- 지도와 위치 권한 상태를 표시합니다. -->
      <div id="statusMessage" role="status" aria-live="polite">
        카카오맵을 불러오는 중입니다...
      </div>

      <!-- 검색 결과를 표시합니다. -->
      <div id="resultList"></div>
    </aside>

    <!-- 오른쪽: 지도 -->
    <main id="map" aria-label="카카오 지도"></main>
  </div>

  <script>
    // 본인의 JavaScript 키로 반드시 변경하세요.
    const kakaoKey = "여기에_JavaScript_키_입력";

    // 지도와 검색 기능에서 사용할 변수입니다.
    let map = null;
    let placesService = null;
    let currentMarker = null;
    let placeMarkers = [];
    let infoWindow = null;
    let mapReady = false;

    // 상태 메시지를 화면에 표시합니다.
    function showStatus(message) {
      document.getElementById("statusMessage").textContent = message;
    }

    // 카카오맵 SDK를 불러옵니다.
    function loadKakaoMap() {
      if (
        !kakaoKey ||
        kakaoKey === "여기에_JavaScript_키_입력"
      ) {
        showStatus(
          "JavaScript 키가 입력되지 않았습니다. 코드 위쪽의 kakaoKey를 수정해 주세요."
        );
        return;
      }

      showStatus("카카오맵 SDK를 불러오는 중입니다...");

      const script = document.createElement("script");

      // SDK 주소에 키를 한 번만 넣습니다.
      script.src =
        "https://dapi.kakao.com/v2/maps/sdk.js?appkey=" +
        encodeURIComponent(kakaoKey) +
        "&libraries=services&autoload=false";

      script.async = true;

      // SDK 파일을 불러오지 못한 경우입니다.
      script.onerror = function () {
        showStatus(
          "지도 SDK를 불러오지 못했습니다. JavaScript 키, 웹 도메인 등록, 인터넷 연결을 확인해 주세요."
        );
      };

      // SDK 파일이 로드된 후 지도를 준비합니다.
      script.onload = function () {
        if (
          !window.kakao ||
          !window.kakao.maps ||
          typeof window.kakao.maps.load !== "function"
        ) {
          showStatus(
            "지도 SDK가 정상적으로 준비되지 않았습니다. 키와 플랫폼 설정을 확인해 주세요."
          );
          return;
        }

        // 지도 관련 기능은 준비가 끝난 뒤 실행합니다.
        window.kakao.maps.load(function () {
          try {
            initializeMap();
          } catch (error) {
            console.error("지도 초기화 오류:", error);
            showStatus(
              "지도 초기화 중 오류가 발생했습니다. 브라우저 개발자 도구의 Console을 확인해 주세요."
            );
          }
        });
      };

      document.head.appendChild(script);
    }

    // 지도를 만들고 검색 기능을 준비합니다.
    function initializeMap() {
      const mapContainer = document.getElementById("map");

      // 처음에는 서울시청을 중심으로 표시합니다.
      const defaultPosition = new kakao.maps.LatLng(
        37.5665,
        126.9780
      );

      const mapOption = {
        center: defaultPosition,
        level: 5
      };

      // 지도 객체를 생성합니다.
      map = new kakao.maps.Map(mapContainer, mapOption);

      // 장소 검색 서비스와 정보창을 생성합니다.
      placesService = new kakao.maps.services.Places(map);

      infoWindow = new kakao.maps.InfoWindow({
        zIndex: 3
      });

      // 지도 준비가 완료되었음을 기록합니다.
      mapReady = true;

      // 지도 크기를 다시 계산합니다.
      map.relayout();
      map.setCenter(defaultPosition);
      map.setLevel(5);

      showStatus(
        "지도가 준비되었습니다. 현재 위치 권한을 확인하고 있습니다."
      );

      // 검색 버튼 기능을 연결합니다.
      document.getElementById("searchForm")
        .addEventListener("submit", function (event) {
          event.preventDefault();
          searchPlaces();
        });

      // 지도 준비 후 현재 위치를 요청합니다.
      getCurrentLocation();
    }

    // 브라우저에 현재 위치 권한을 요청합니다.
    function getCurrentLocation() {
      // 위치 기능을 지원하는지 확인합니다.
      if (!navigator.geolocation) {
        showStatus(
          "이 브라우저에서는 현재 위치 기능을 사용할 수 없습니다. 서울시청을 중심으로 표시합니다."
        );
        return;
      }

      // 위치를 가져오는 동안 안내 문구를 먼저 보여줍니다.
      showStatus(
        "현재 위치를 확인 중입니다. 브라우저에 위치 권한 창이 나타나면 허용을 눌러 주세요."
      );

      // 브라우저의 위치 권한 요청을 실행합니다.
      navigator.geolocation.getCurrentPosition(
        function (position) {
          // 현재 위치의 위도와 경도를 가져옵니다.
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;

          const currentPosition = new kakao.maps.LatLng(
            latitude,
            longitude
          );

          // 현재 위치를 중심으로 이동합니다.
          map.setCenter(currentPosition);
          map.setLevel(5);

          // 기존 현재 위치 마커가 있다면 제거합니다.
          if (currentMarker) {
            currentMarker.setMap(null);
          }

          // 현재 위치에 마커를 표시합니다.
          currentMarker = new kakao.maps.Marker({
            map: map,
            position: currentPosition
          });

          showStatus(
            "현재 위치를 찾았습니다. 이제 원하는 장소를 검색해 보세요."
          );
        },

        function (error) {
          // 위치를 가져오지 못한 원인을 구분합니다.
          if (error.code === 1) {
            showStatus(
              "위치 권한이 거부되었습니다. 브라우저 주소창 옆의 사이트 설정에서 위치 권한을 허용해 주세요. 지도는 서울시청을 중심으로 표시됩니다."
            );
          } else if (error.code === 2) {
            showStatus(
              "현재 위치를 확인할 수 없습니다. 기기의 위치 설정과 인터넷 연결을 확인해 주세요. 지도는 서울시청을 중심으로 표시됩니다."
            );
          } else if (error.code === 3) {
            showStatus(
              "현재 위치 확인 시간이 초과되었습니다. 잠시 후 새로고침해 주세요."
            );
          } else {
            showStatus(
              "현재 위치를 가져오지 못했습니다. HTTPS 또는 localhost에서 실행 중인지 확인해 주세요."
            );
          }
        },

        {
          enableHighAccuracy: false,
          timeout: 15000,
          maximumAge: 60000
        }
      );
    }

    // 입력한 장소를 검색합니다.
    function searchPlaces() {
      if (!mapReady || !placesService) {
        showStatus("지도가 준비될 때까지 잠시 기다려 주세요.");
        return;
      }

      const keyword = document
        .getElementById("searchInput")
        .value
        .trim();

      if (!keyword) {
        showStatus("검색어를 입력해 주세요.");
        return;
      }

      showStatus("장소를 검색하고 있습니다...");
      document.getElementById("resultList").replaceChildren();

      // 이전 검색 결과 마커를 제거합니다.
      removePlaceMarkers();

      placesService.keywordSearch(
        keyword,
        function (data, status) {
          if (status === kakao.maps.services.Status.OK) {
            displayPlaces(data);
          } else if (
            status === kakao.maps.services.Status.ZERO_RESULT
          ) {
            showStatus("검색 결과가 없습니다.");
          } else {
            showStatus(
              "검색에 실패했습니다. 카카오맵 설정과 인터넷 연결을 확인해 주세요."
            );
          }
        },
        {
          location: map.getCenter(),
          size: 15
        }
      );
    }

    // 검색 결과를 목록과 지도에 표시합니다.
    function displayPlaces(places) {
      const resultList = document.getElementById("resultList");
      const bounds = new kakao.maps.LatLngBounds();

      resultList.replaceChildren();

      places.forEach(function (place, index) {
        const position = new kakao.maps.LatLng(
          Number(place.y),
          Number(place.x)
        );

        // 검색 결과 위치에 마커를 만듭니다.
        const marker = new kakao.maps.Marker({
          map: map,
          position: position
        });

        placeMarkers.push(marker);
        bounds.extend(position);

        // 검색 결과 항목을 만듭니다.
        const item = document.createElement("div");
        item.className = "place-item";

        const name = document.createElement("div");
        name.className = "place-name";
        name.textContent =
          (index + 1) + ". " + place.place_name;

        const category = document.createElement("div");
        category.className = "place-category";
        category.textContent =
          place.category_name || "분류 정보 없음";

        const address = document.createElement("div");
        address.className = "place-address";
        address.textContent =
          place.road_address_name ||
          place.address_name ||
          "주소 정보 없음";

        item.appendChild(name);
        item.appendChild(category);
        item.appendChild(address);

        // 항목을 클릭하면 지도에서 해당 장소를 보여줍니다.
        item.addEventListener("click", function () {
          map.setCenter(position);
          map.setLevel(5);

          infoWindow.setContent(
            '<div style="padding:10px;font-size:13px;">' +
            escapeHtml(place.place_name) +
            "</div>"
          );

          infoWindow.open(map, marker);
        });

        // 지도 마커를 클릭해도 장소 이름을 표시합니다.
        kakao.maps.event.addListener(
          marker,
          "click",
          function () {
            map.setCenter(position);

            infoWindow.setContent(
              '<div style="padding:10px;font-size:13px;">' +
              escapeHtml(place.place_name) +
              "</div>"
            );

            infoWindow.open(map, marker);
          }
        );

        resultList.appendChild(item);
      });

      // 검색 결과가 모두 보이도록 지도 범위를 조정합니다.
      map.setBounds(bounds);

      showStatus(
        "검색 결과 " + places.length + "개를 찾았습니다."
      );
    }

    // 이전 검색 결과의 마커를 제거합니다.
    function removePlaceMarkers() {
      placeMarkers.forEach(function (marker) {
        marker.setMap(null);
      });

      placeMarkers = [];

      if (infoWindow) {
        infoWindow.close();
      }
    }

    // 정보창에 넣을 텍스트의 특수문자를 처리합니다.
    function escapeHtml(value) {
      const entities = {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      };

      return String(value).replace(
        /[&<>"']/g,
        function (character) {
          return entities[character];
        }
      );
    }

    // 페이지가 준비되면 카카오맵을 불러옵니다.
    loadKakaoMap();
  </script>
</body>
</html>
